<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA World Cup 2026 — Bảng điều khiển trực tuyến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#eef2f8;
    --night-2:#ffffff;
    --night-3:#c9d6ea;
    --gold:#1657e0;
    --gold-dim:#0d3aa8;
    --pitch:#1fa35c;
    --ice:#16213e;
    --muted:#6b7a99;
    --line:#e1e7f2;
    --arg:#2f8fef;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--night);
    color:var(--ice);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--night-3);border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold-dim);}

  .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:0.01em;}
  .mono{font-family:'Space Mono',monospace;}

  .app{
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- TOPBAR / FLOODLIGHT SIGNATURE ---------- */
  .topbar{
    position:relative;
    flex:0 0 auto;
    overflow:hidden;
    background:radial-gradient(120% 260% at 12% -60%, rgba(22,87,224,0.14), transparent 55%),
               radial-gradient(120% 260% at 88% -60%, rgba(47,143,239,0.12), transparent 55%),
               linear-gradient(180deg, #0f3fc7, #123fbf);
    border-bottom:1px solid var(--gold-dim);
    padding:16px 24px 14px;
    box-shadow:0 2px 10px rgba(15,25,60,0.15);
  }
  .topbar h1,
  .topbar .brand-sub,
  .topbar .clock-label,
  .topbar #vn-clock{color:#fff;}
  .topbar .brand-sub{border-left-color:rgba(255,255,255,0.45);color:rgba(255,255,255,0.75);}
  .topbar .clock-label{color:rgba(255,255,255,0.65);}
  .topbar h1 .gold{color:#ffd75e;}
  .topbar #vn-clock{color:#ffd75e;}
  .topbar::after{
    content:"";
    position:absolute;inset:auto 0 0 0;height:3px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.6;
    animation:sweep 6s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{opacity:0.25; transform:translateX(-10%);}
    50%{opacity:0.7; transform:translateX(10%);}
  }
  .topbar-row{
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;
    position:relative;z-index:1;
  }
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  h1{margin:0;font-size:clamp(22px,3vw,34px);text-transform:uppercase;line-height:1;}
  h1 .gold{color:var(--gold);}
  .brand-sub{
    font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);
    border-left:2px solid var(--gold-dim);padding-left:10px;
  }
  .clock-block{text-align:right;}
  .clock-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
  #vn-clock{font-size:22px;font-variant-numeric:tabular-nums;color:var(--gold);letter-spacing:0.03em;}

  .tabs{
    display:flex;
    gap:8px;margin-top:14px;position:relative;z-index:1;
  }
  .tabs button{
    flex:1;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.8);
    padding:11px 8px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:0.03em;
    text-transform:uppercase;cursor:pointer;transition:background 0.15s,color 0.15s;
  }
  .tabs button:hover{background:rgba(255,255,255,0.18);color:#fff;}
  .tabs button.active{background:#fff;color:var(--gold);border-color:#fff;}

  /* ---------- DASHBOARD ---------- */
  .dashboard{
    flex:1 1 auto;
    min-height:0;
    display:flex;
  }
  .pane{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    background:var(--night);
    display:none;
    flex-direction:column;
  }
  .pane.active{display:flex;}
  .pane-head{
    flex:0 0 auto;
    padding:16px 24px 12px;
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg, var(--night-2), transparent);
  }
  .pane-head .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .dot.gold{background:var(--gold);box-shadow:0 0 8px rgba(22,87,224,0.45);}
  .dot.pitch{background:var(--pitch);box-shadow:0 0 8px rgba(31,163,92,0.45);}
  .dot.arg{background:var(--arg);box-shadow:0 0 8px rgba(47,143,239,0.45);}
  .pane-head span{
    font-size:12.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:600;
  }
  .pane-body{
    flex:1 1 auto;min-height:0;overflow-y:auto;
    padding:6px 24px 30px;
  }
  #pane-upcoming .matches{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
  }
  #pane-done .matches{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
  }

  /* ---------- MATCH TICKET CARDS ---------- */
  .matches{display:flex;flex-direction:column;gap:12px;padding-top:6px;}
  .match{
    position:relative;
    background:var(--night-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    box-shadow:0 1px 3px rgba(20,35,80,0.06);
  }
  .match::before,.match::after{
    content:"";position:absolute;width:14px;height:14px;background:var(--night);
    border-radius:50%;top:50%;transform:translateY(-50%);
  }
  .match::before{left:-8px;}
  .match::after{right:-8px;}
  .match-inner-divider{
    border-top:1px dashed var(--line);margin:8px 0;
  }
  .tag{
    font-size:9.5px;text-transform:uppercase;letter-spacing:0.1em;
    color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;
  }
  .tag .status.upcoming{color:var(--gold);}
  .tag .status.done{color:var(--pitch);}
  .team-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}
  .team-row .name{font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;}
  .team-row .score{font-family:'Anton',sans-serif;font-size:20px;font-variant-numeric:tabular-nums;color:var(--ice);}
  .team-row .score.dash{color:var(--muted);font-family:'Inter',sans-serif;font-weight:800;}
  .meta{font-size:10.5px;color:var(--muted);margin-top:6px;}

  /* ---------- WIN / LOSE HIGHLIGHT ---------- */
  .team-row.win{
    background:linear-gradient(90deg, rgba(31,163,92,0.12), rgba(31,163,92,0.02));
    border-radius:7px;margin:0 -8px;padding:5px 8px;
    box-shadow:inset 3px 0 0 var(--pitch);
  }
  .team-row.win .name{color:var(--pitch);font-weight:800;}
  .team-row.win .score{color:var(--pitch);}
  .team-row.win .win-icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;margin-left:6px;color:#fff;background:var(--pitch);
    border-radius:50%;padding:3px;flex:0 0 auto;
    box-shadow:0 0 0 2px rgba(31,163,92,0.18);
  }
  .team-row.win .win-icon svg{width:100%;height:100%;}
  .team-row.lose{opacity:0.55;}
  .team-row.lose .name,.team-row.lose .score{color:var(--muted);font-weight:600;}
  .team-row.draw .name,.team-row.draw .score{color:var(--ice);}
  .status-note{color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;}
  .pen-note{
    font-size:10.5px;color:var(--muted);margin-top:6px;padding-top:6px;
    border-top:1px dashed var(--line);font-family:'Space Mono',monospace;
  }

  .match.arg{border-color:rgba(47,143,239,0.35);background:linear-gradient(135deg, rgba(47,143,239,0.07), var(--night-2) 65%);}
  .match.arg .name.arg-team{color:var(--arg);}
  .match.arg .name.arg-team::before{content:"🇦🇷 ";}
  .match.arg .tag .status.upcoming{color:var(--arg);}

  /* ---------- MESSI #10 BADGE ---------- */
  .messi-badge{
    display:inline-flex;align-items:center;gap:3px;
    font-family:'Anton',sans-serif;font-weight:400;font-size:11px;line-height:1;
    padding:3px 7px 3px 5px;border-radius:20px;
    background:linear-gradient(135deg, var(--arg), #8fd0ff 55%, var(--gold));
    color:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,0.6) inset, 0 0 8px rgba(47,143,239,0.45);
    letter-spacing:0.02em;
    animation:badge-glow 2.4s ease-in-out infinite;
  }
  .messi-badge svg{width:10px;height:10px;flex:0 0 auto;}
  @keyframes badge-glow{
    0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,0.6) inset, 0 0 6px rgba(47,143,239,0.35);}
    50%{box-shadow:0 0 0 1px rgba(255,255,255,0.8) inset, 0 0 12px rgba(22,87,224,0.55);}
  }
  .group-card tr.messi-row{position:relative;}
  .group-card tr.messi-row td:first-child{color:var(--arg);font-weight:700;}

  .empty-note{color:var(--muted);font-size:13px;padding:18px 0;}

  /* ---------- GROUPS ---------- */
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding-top:6px;}
  .group-card{background:var(--night-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(20,35,80,0.06);}
  .group-card h3{
    margin:0;padding:8px 12px;background:rgba(22,87,224,0.08);
    font-size:11.5px;letter-spacing:0.08em;color:var(--gold);text-transform:uppercase;
    font-family:'Anton',sans-serif;font-weight:400;
  }
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:5px 10px;text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.03em;}
  td.num, th.num{text-align:center;font-family:'Space Mono',monospace;}
  tr:nth-child(even){background:rgba(22,87,224,0.03);}
  tr.qualify{border-left:3px solid var(--pitch);}

  /* ---------- LIVE BANNER ---------- */
  .live-banner{
    flex:0 0 auto;display:none;
    padding:10px 24px;background:linear-gradient(90deg, rgba(220,38,38,0.08), rgba(220,38,38,0.02));
    border-bottom:1px solid rgba(220,38,38,0.25);
    gap:12px;overflow-x:auto;
  }
  .live-banner.show{display:flex;}
  .live-card{
    flex:0 0 auto;min-width:230px;background:var(--night-2);border:1px solid rgba(220,38,38,0.3);
    border-radius:9px;padding:9px 12px;box-shadow:0 1px 4px rgba(20,35,80,0.08);
  }
  .live-card .live-tag{
    display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;
    letter-spacing:0.1em;color:#dc2626;text-transform:uppercase;margin-bottom:5px;
  }
  .live-card .live-tag .live-red-dot{
    width:6px;height:6px;border-radius:50%;background:#dc2626;animation:pulse 1.4s ease-in-out infinite;
  }
  .live-card .live-clock{color:var(--muted);font-family:'Space Mono',monospace;font-size:10px;}
  .live-card .team-row{padding:2px 0;}
  .live-card .team-row .name{font-size:13px;}
  .live-card .team-row .score{font-size:17px;}

  /* ---------- STATUS BAR ---------- */
  .statusbar{
    flex:0 0 auto;
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 24px;font-size:10.5px;color:var(--muted);
    border-top:1px solid var(--line);background:var(--night-2);
  }
  .statusbar .live-dot{width:6px;height:6px;border-radius:50%;background:var(--pitch);display:inline-block;margin-right:6px;
    animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  @media (prefers-reduced-motion: reduce){
    .topbar::after{animation:none;}
    .statusbar .live-dot{animation:none;}
    .messi-badge{animation:none;}
  }

  /* ---------- MUSIC TOGGLE ---------- */
  .music-toggle{
    position:fixed;right:20px;bottom:20px;z-index:50;
    width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg, var(--gold), var(--arg));
    color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(22,87,224,0.35);
    transition:transform 0.15s ease;
  }
  .music-toggle:hover{transform:scale(1.06);}
  .music-toggle.on{animation:music-pulse 1.6s ease-in-out infinite;}
  @keyframes music-pulse{
    0%,100%{box-shadow:0 4px 14px rgba(22,87,224,0.35);}
    50%{box-shadow:0 4px 22px rgba(22,87,224,0.65);}
  }
  @media (prefers-reduced-motion: reduce){
    .music-toggle.on{animation:none;}
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:600px){
    .clock-block{display:none;}
    .tabs button{font-size:11px;padding:9px 4px;}
  }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <h1 class="display">Fifa World Cup <span class="gold">2026</span></h1>
        <span class="brand-sub">By Tin Vo Quoc</span>

    <div class="tabs">

    </div>

  <div class="live-banner" id="live-banner"></div>

  <div class="dashboard">

      <div class="pane-head"><span class="dot gold"></span><span>Sắp diễn ra</span></div>
      <div class="pane-body"><div class="matches" id="matches-upcoming"></div></div>
    </div>
    <div class="pane" id="pane-done">
      <div class="pane-head"><span class="dot pitch"></span><span>Kết quả</span></div>
      <div class="pane-body"><div class="matches" id="matches-done"></div></div>
    </div>

      <div class="pane-head"><span class="dot arg"></span><span>Bảng xếp hạng vòng bảng</span></div>

    </div>

  <div class="statusbar">
    <div><span class="live-dot"></span>Lịch/kết quả: mỗi 5 phút (openfootball) · Trực tiếp: mỗi 30 giây (ESPN)</div>
    <div id="last-updated">Đang tải…</div>
  </div>

</div>

<!-- Nhạc nền: nhúng qua YouTube IFrame Player chính thức (không tải/lưu trữ file nhạc) -->
<div id="yt-player-wrap" style="position:fixed;bottom:-200px;left:-200px;width:1px;height:1px;overflow:hidden;">
  <div id="yt-player"></div>
</div>
<button id="music-toggle" class="music-toggle" title="Bật nhạc nền" onclick="toggleMusic()">🔈</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ---- Trình phát nhạc nền qua YouTube IFrame API ----
// Trình duyệt chặn tự phát có tiếng, nên video bắt đầu ở chế độ tắt tiếng;
// người dùng bấm nút tròn góc dưới để bật tiếng.
const YT_VIDEO_ID = 'n1TAtLFIFAY';
let ytPlayer = null;
let musicOn = false;

function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('yt-player', {
    height: '0',
    width: '0',
    videoId: YT_VIDEO_ID,
    playerVars: {
      autoplay: 1,
      mute: 1,
      loop: 1,
      playlist: YT_VIDEO_ID,
      controls: 0
    },
    events: {
      onReady: (e) => { e.target.playVideo(); }
    }
  });
}

function setMusicUI(on){
  const btn = document.getElementById('music-toggle');
  musicOn = on;
  if(on){
    btn.textContent = '🔊';
    btn.title = 'Tắt nhạc nền';
    btn.classList.add('on');
  } else {
    btn.textContent = '🔈';
    btn.title = 'Bật nhạc nền';
    btn.classList.remove('on');
  }
}

function toggleMusic(){
  if(!ytPlayer || typeof ytPlayer.unMute !== 'function') return;
  if(musicOn){
    ytPlayer.mute();
    setMusicUI(false);
  } else {
    ytPlayer.unMute();
    ytPlayer.playVideo();
    setMusicUI(true);
  }
}

// Trình duyệt luôn chặn phát nhạc có tiếng ngay khi trang vừa mở (chính sách autoplay
// của Chrome/Safari/Firefox, không trang web nào lách được). Cách gần nhất với
// "tự động": bật tiếng ngay khi người dùng có tương tác ĐẦU TIÊN bất kỳ trên trang
// (click, chạm, cuộn, gõ phím) — không cần bấm đúng nút nhạc.
let autoUnmuteDone = false;
function autoUnmuteOnFirstInteraction(){
  if(autoUnmuteDone || !ytPlayer || typeof ytPlayer.unMute !== 'function') return;
  autoUnmuteDone = true;
  ytPlayer.unMute();
  ytPlayer.playVideo();
  setMusicUI(true);
  ['click','touchstart','keydown','scroll'].forEach(evt =>
    document.removeEventListener(evt, autoUnmuteOnFirstInteraction)
  );
}
['click','touchstart','keydown','scroll'].forEach(evt =>
  document.addEventListener(evt, autoUnmuteOnFirstInteraction, { once:false, passive:true })
);
</script>

<script>
// ---- Nguồn dữ liệu miễn phí, không cần API key ----
const DATA_URLS = [
  'https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json',
  'https://cdn.jsdelivr.net/gh/openfootball/worldcup.json@master/2026/worldcup.json'
];
const AUTO_REFRESH_MS = 5 * 60 * 1000;

const DOW = ['CN','T2','T3','T4','T5','T6','T7'];
function pad(n){ return String(n).padStart(2,'0'); }

// Badge nhỏ đánh dấu đội có Messi mang áo số 10 — chỉ là nhãn chữ + icon ngôi sao,
// không dùng hình ảnh/khuôn mặt thật.
const MESSI_BADGE = `<span class="messi-badge" title="Lionel Messi · Áo số 10">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.6 1.5 6.8L12 17l-6.2 3.5 1.5-6.8L2.2 9.1l6.9-.8z"/></svg>10</span>`;

// Icon cúp nhỏ đánh dấu đội thắng ở các trận đã kết thúc
const WIN_ICON = `<span class="win-icon" title="Đội thắng">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v2h2.5a1 1 0 0 1 1 1v1.2c0 2.5-1.9 4.6-4.4 5-.7 1.7-2.1 3-3.8 3.5V19h3v2H7.7v-2h3v-3.3c-1.7-.5-3.1-1.8-3.8-3.5C4.4 11.8 2.5 9.7 2.5 7.2V6a1 1 0 0 1 1-1H6V3zm0 4H4.5v.2c0 1.3.7 2.5 1.8 3.1A9 9 0 0 1 6 7zm12 0a9 9 0 0 1-.3 3.3c1.1-.6 1.8-1.8 1.8-3.1V7H18z"/></svg>
</span>`;

function toVN(dateStr, timeStr){
  if(!dateStr || !timeStr) return null;
  const m = timeStr.match(/(\d{1,2}):(\d{2})\s*UTC([+-]\d+)/);
  if(!m) return null;
  const hh = parseInt(m[1], 10), mm = parseInt(m[2], 10), offset = parseInt(m[3], 10);
  const [y, mo, d] = dateStr.split('-').map(Number);
  const utcMs = Date.UTC(y, mo - 1, d, hh - offset, mm);
  return new Date(utcMs + 7 * 60 * 60 * 1000);
}
function fmtVN(d){
  if(!d) return '';
  return `${DOW[d.getUTCDay()]}, ${pad(d.getUTCDate())}/${pad(d.getUTCMonth()+1)}, ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
}
function isPlaceholderTeam(name){
  if(!name) return true;
  return /^[0-9]/.test(name) || /^[WL]\d+$/.test(name) || name.includes('/');
}

async function fetchFresh(){
  let lastErr = null;
  for(const url of DATA_URLS){
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(!data || !Array.isArray(data.matches)) throw new Error('Dữ liệu không hợp lệ');
      return data;
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Không fetch được nguồn nào');
}

function computeGroups(matches){
  const groups = {};
  matches.forEach(m => {
    if(!m.group) return;
    const g = m.group.replace('Group ', '').trim();
    if(!groups[g]) groups[g] = {};
    [m.team1, m.team2].forEach(t => {
      if(t && !groups[g][t]) groups[g][t] = { team: t, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 };
    });
    if(m.score && Array.isArray(m.score.ft)){
      const [s1, s2] = m.score.ft;
      const t1 = groups[g][m.team1], t2 = groups[g][m.team2];
      if(!t1 || !t2) return;
      t1.p++; t2.p++;
      t1.gf += s1; t1.ga += s2;
      t2.gf += s2; t2.ga += s1;
      if(s1 > s2){ t1.w++; t1.pts += 3; t2.l++; }
      else if(s1 < s2){ t2.w++; t2.pts += 3; t1.l++; }
      else { t1.d++; t2.d++; t1.pts += 1; t2.pts += 1; }
    }
  });
  const result = {};
  Object.keys(groups).forEach(g => {
    result[g] = Object.values(groups[g]).sort((a,b) =>
      b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf
    );
  });
  return result;
}

// Xác định tỉ số hiển thị + đội thắng thực sự, có tính hiệp phụ (et) và luân lưu (p).
// Vòng bảng: chỉ có ft, hòa thì hòa thật.
// Vòng loại trực tiếp: nếu hòa sau 90p (ft) -> xét hiệp phụ (et); nếu vẫn hòa -> xét luân lưu (p).
function getMatchResult(score){
  const ft = score.ft;
  const et = Array.isArray(score.et) ? score.et : null;
  const pen = Array.isArray(score.p) ? score.p : null;

  // Tỉ số hiển thị chính trên thẻ trận: ưu tiên hiệp phụ nếu có (đã bao gồm bàn thắng hiệp chính), fallback ft
  const display = et || ft;
  const [hs, as] = display;

  let winner = 0; // 0 = hòa/chưa xác định, 1 = đội 1 thắng, 2 = đội 2 thắng
  let mode = 'ft';
  if(hs > as) { winner = 1; mode = et ? 'et' : 'ft'; }
  else if(as > hs) { winner = 2; mode = et ? 'et' : 'ft'; }
  else if(pen){
    // hòa sau hiệp chính (và hiệp phụ nếu có) -> luân lưu quyết định
    winner = pen[0] > pen[1] ? 1 : (pen[1] > pen[0] ? 2 : 0);
    mode = 'pen';
  }

  return { hs, as, winner, mode, pen };
}


  const elUpcoming = document.getElementById('matches-upcoming');
  const elDone = document.getElementById('matches-done');

  const withTime = matches
    .filter(m => !isPlaceholderTeam(m.team1) && !isPlaceholderTeam(m.team2))
    .map(m => ({ ...m, vn: toVN(m.date, m.time) }))
    .filter(m => m.vn);

  const done = withTime.filter(m => m.score && Array.isArray(m.score.ft))
    .sort((a,b) => b.vn - a.vn).slice(0, 30);
  const upcoming = withTime.filter(m => !(m.score && Array.isArray(m.score.ft)))
    .sort((a,b) => a.vn - b.vn).slice(0, 30);

  elUpcoming.innerHTML = upcoming.length === 0
    ? '<div class="empty-note">Chưa có trận nào sắp diễn ra.</div>'
    : upcoming.map(m => {
      const local = fmtVN(m.vn);
      const isArg1 = m.team1 === 'Argentina';
      const isArg2 = m.team2 === 'Argentina';
      const cardClass = (isArg1 || isArg2) ? 'match arg' : 'match';
      return `<div class="${cardClass}">
        <div class="tag"><span class="status upcoming">Sắp diễn ra</span><span>${local}</span></div>
        <div class="team-row"><span class="name${isArg1 ? ' arg-team' : ''}">${m.team1}${isArg1 ? MESSI_BADGE : ''}</span><span class="score dash">–</span></div>
        <div class="match-inner-divider"></div>
        <div class="team-row"><span class="name${isArg2 ? ' arg-team' : ''}">${m.team2}${isArg2 ? MESSI_BADGE : ''}</span><span class="score dash">–</span></div>
        <div class="meta">${m.round || ''}${m.ground ? ' · ' + m.ground : ''}</div>
      </div>`;
    }).join('');

  elDone.innerHTML = done.length === 0
    ? '<div class="empty-note">Chưa có kết quả nào.</div>'
    : done.map(m => {
      const local = fmtVN(m.vn);
      const isArg1 = m.team1 === 'Argentina';
      const isArg2 = m.team2 === 'Argentina';
      const cardClass = (isArg1 || isArg2) ? 'match arg' : 'match';

      const { hs, as, winner, mode, pen } = getMatchResult(m.score);
      const isWin1 = winner === 1, isWin2 = winner === 2;
      const row1Class = 'team-row' + (isWin1 ? ' win' : isWin2 ? ' lose' : ' draw');
      const row2Class = 'team-row' + (isWin2 ? ' win' : isWin1 ? ' lose' : ' draw');
      const statusNote = mode === 'pen' ? ' <span class="status-note">(Luân lưu)</span>'
        : mode === 'et' ? ' <span class="status-note">(Hiệp phụ)</span>' : '';
      const penNote = pen ? `<div class="pen-note">Luân lưu: ${pen[0]}–${pen[1]}</div>` : '';

      return `<div class="${cardClass}">
        <div class="tag"><span class="status done">Kết thúc${statusNote}</span><span>${local}</span></div>
        <div class="${row1Class}"><span class="name${isArg1 ? ' arg-team' : ''}">${m.team1}${isArg1 ? MESSI_BADGE : ''}</span><span class="score">${hs}${isWin1 ? WIN_ICON : ''}</span></div>
        <div class="match-inner-divider"></div>
        <div class="${row2Class}"><span class="name${isArg2 ? ' arg-team' : ''}">${m.team2}${isArg2 ? MESSI_BADGE : ''}</span><span class="score">${as}${isWin2 ? WIN_ICON : ''}</span></div>
        ${penNote}
      </div>`;
    }).join('');
}

function renderGroups(groups){
  const el = document.getElementById('groups');
  const keys = Object.keys(groups).sort();
  if(keys.length === 0){
    el.innerHTML = '<div class="empty-note">Chưa có dữ liệu bảng xếp hạng.</div>';
    return;
  }
  el.innerHTML = keys.map(g => {
    const rows = groups[g].map((t, i) => {
      const isArg = t.team === 'Argentina';
      const rowClasses = [i < 2 ? 'qualify' : '', isArg ? 'messi-row' : ''].filter(Boolean).join(' ');
      return `
      <tr class="${rowClasses}">
        <td>${t.team}${isArg ? MESSI_BADGE : ''}</td>
        <td class="num">${t.w}</td>
        <td class="num">${t.l}</td>
        <td class="num">${t.d}</td>
        <td class="num"><b>${t.pts}</b></td>
      </tr>`;
    }).join('');
    return `<div class="group-card">
      <h3>Bảng ${g}</h3>
      <table>
        <tr><th>Đội</th><th class="num">T</th><th class="num">B</th><th class="num">H</th><th class="num">Điểm</th></tr>
        ${rows}
      </table>
    </div>`;
  }).join('');
}

// ---- Trận đang diễn ra (LIVE) — nguồn ESPN scoreboard, cập nhật theo phút thực ----
// Lưu ý: openfootball/worldcup.json chỉ được cộng đồng cập nhật thủ công SAU khi trận
// kết thúc (không có tỉ số/phút thi đấu khi trận đang live), nên cần nguồn riêng cho phần này.
const ESPN_LIVE_URL = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';
const LIVE_REFRESH_MS = 30 * 1000;

function fmtLiveClock(status){
  const st = status?.type?.state;
  if(st === 'in'){
    if(status.type.name === 'STATUS_HALFTIME') return 'Nghỉ giữa hiệp';
    const clock = status.displayClock || '';
    const period = status.period ? `H${status.period}` : '';
    return [period, clock].filter(Boolean).join(' · ') || 'Đang diễn ra';
  }
  if(st === 'post') return status.type.name === 'STATUS_FULL_TIME' ? 'Kết thúc' : (status.type.shortDetail || 'Kết thúc');
  return status?.type?.shortDetail || '';
}

async function fetchLiveMatches(){
  const el = document.getElementById('live-banner');
  try{
    const res = await fetch(ESPN_LIVE_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const events = Array.isArray(data.events) ? data.events : [];
    const live = events.filter(ev => ev?.status?.type?.state === 'in');

    if(live.length === 0){
      el.classList.remove('show');
      el.innerHTML = '';
      return;
    }

    el.innerHTML = live.map(ev => {
      const comp = ev.competitions?.[0];
      const competitors = comp?.competitors || [];
      const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
      const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
      if(!home || !away) return '';
      const clockTxt = fmtLiveClock(comp.status);
      return `<div class="live-card">
        <div class="live-tag"><span class="live-red-dot"></span>Trực tiếp</div>
        <div class="team-row"><span class="name">${home.team?.displayName || home.team?.name || ''}</span><span class="score">${home.score ?? '-'}</span></div>
        <div class="team-row"><span class="name">${away.team?.displayName || away.team?.name || ''}</span><span class="score">${away.score ?? '-'}</span></div>
        <div class="live-clock">${clockTxt}</div>
      </div>`;
    }).join('');
    el.classList.add('show');
  }catch(e){
    // Im lặng bỏ qua nếu nguồn live tạm thời lỗi — phần lịch/kết quả chính vẫn hoạt động bình thường
    console.warn('Không tải được dữ liệu trực tiếp:', e);
  }
}
fetchLiveMatches();
setInterval(fetchLiveMatches, LIVE_REFRESH_MS);

async function run(){
  try{
    const data = await fetchFresh();
    if(data){
      renderMatches(data.matches);
      renderGroups(computeGroups(data.matches));
      document.getElementById('last-updated').textContent =
        'Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN');
    }
  }catch(e){
    document.getElementById('last-updated').textContent = 'Không tải được dữ liệu — sẽ thử lại';
    console.warn('Không tải được dữ liệu World Cup:', e);
  }
}
run();
setInterval(run, AUTO_REFRESH_MS);

// ---- Đồng hồ giờ Việt Nam ----
function tickClock(){
  const now = new Date();
  const vn = new Date(now.getTime() + 7 * 60 * 60000); // getTime() luôn là mốc UTC, cộng thêm 7 giờ = giờ Việt Nam
  document.getElementById('vn-clock').textContent =
    `${pad(vn.getUTCHours())}:${pad(vn.getUTCMinutes())}:${pad(vn.getUTCSeconds())}`;
}
tickClock();
setInterval(tickClock, 1000);

// ---- Chuyển tab trên màn hình nhỏ ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.target).classList.add('active');
  });
});
</script>
